name: android

# Builds the Android APK on every push to main (artifact) and attaches it to
# a GitHub release when a v* tag is pushed.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'
  # Path dependencies (pubspec.yaml: ../zx and ../../xprs/reticulum-dart),
  # pinned to the commits this tree was built and tested with.
  ZX_REF: fdadb5dfaf22f38e6237ff7253479142806c0db2
  RETICULUM_REF: 1aa323d90e94fa6ab7dfa52ab81b8cd3c533e5e2

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Fetch path dependencies (zx, reticulum-dart)
        shell: bash
        run: |
          fetch() { # <repo> <ref> <dir>
            mkdir -p "$3" && cd "$3"
            git init -q && git remote add origin "https://github.com/$1.git"
            git fetch -q --depth 1 origin "$2" && git checkout -q FETCH_HEAD
            cd - > /dev/null
          }
          fetch x1watt/zx "$ZX_REF" ../zx
          fetch xprs-dev/reticulum-dart "$RETICULUM_REF" ../../xprs/reticulum-dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Version and build number
        shell: bash
        run: |
          CODE=$(git rev-list --count HEAD)
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          sed -i "s/^version:.*/version: ${VER}+${CODE}/" pubspec.yaml
          echo "APK_VERSION=${VER}" >> "$GITHUB_ENV"
          # The repo caps Gradle at 1.5 GB for the small dev machine; CI has room.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # A release signed with a throwaway key cannot update installed apps.
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a release"; exit 1
            fi
            echo "::warning::no release key: this APK is signed with a throwaway debug key"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-senhorio}"
            echo "storeType=pkcs12"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/senhorio-${APK_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: senhorio-android
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
