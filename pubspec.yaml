name: senhorio
description: "Senhorio — shared rent and expense accounting for buildings, synced peer-to-peer over Reticulum."
publish_to: 'none'

version: 0.3.1+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  zx:                                    # local archive-database (SQL, time travel, seals)
    path: ../zx
  reticulum:                             # Reticulum transport, LXMF, NOSTR helpers
    path: ../../xprs/reticulum-dart

  provider: ^6.1.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^10.3.1        # nsec + DB password in the OS keystore
  image_picker: ^1.1.2                   # camera / gallery on Android
  file_selector: ^1.0.3                  # file picker on desktop
  image: ^4.3.0                          # receipt resize / JPEG re-encode
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0                   # tel:/mailto: links for tenant contacts
  http: ^1.2.0                           # GitHub releases (auto-update)
  package_info_plus: ^8.0.0              # installed version for the update check

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: icons/senhorio.png
  adaptive_icon_background: "#0B0F0E"
  adaptive_icon_foreground: icons/senhorio_fg.png

flutter:
  uses-material-design: true
  generate: true
