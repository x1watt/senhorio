<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" rx="220" fill="#0B0F0E"/>
  <!-- building -->
  <rect x="232" y="300" width="400" height="500" rx="28" fill="#4FC9A8"/>
  <rect x="312" y="200" width="240" height="130" rx="24" fill="#4FC9A8"/>
  <!-- windows: three floors, rooms -->
  <g fill="#000000" fill-opacity="0.85">
    <rect x="292" y="370" width="80" height="80" rx="12"/>
    <rect x="392" y="370" width="80" height="80" rx="12"/>
    <rect x="492" y="370" width="80" height="80" rx="12"/>
    <rect x="292" y="490" width="80" height="80" rx="12"/>
    <rect x="392" y="490" width="80" height="80" rx="12"/>
    <rect x="492" y="490" width="80" height="80" rx="12"/>
    <rect x="292" y="610" width="80" height="80" rx="12"/>
    <rect x="392" y="610" width="80" height="140" rx="12"/>
    <rect x="492" y="610" width="80" height="80" rx="12"/>
  </g>
  <!-- lit rooms: green ok, red late -->
  <rect x="300" y="378" width="64" height="64" rx="10" fill="#2ECC71"/>
  <rect x="500" y="498" width="64" height="64" rx="10" fill="#FF5252"/>
  <rect x="300" y="618" width="64" height="64" rx="10" fill="#2ECC71"/>
  <!-- key / coin -->
  <circle cx="740" cy="700" r="120" fill="#F2C94C"/>
  <circle cx="740" cy="700" r="92" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="14"/>
  <text x="740" y="742" font-family="DejaVu Sans, Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#000" fill-opacity="0.8">€</text>
</svg>
